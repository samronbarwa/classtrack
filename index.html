<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ClassTrack — XI-B</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<style>
:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --surface2: #202024;
  --border: #2a2a2e;
  --border2: #3a3a3e;
  --text: #f0f0f2;
  --muted: #888;
  --accent: #4f8ef7;
  --accent-bg: #1a2540;
  --success: #22c55e;
  --success-bg: #0d2318;
  --warning: #f59e0b;
  --warning-bg: #2a1f08;
  --danger: #ef4444;
  --danger-bg: #2a0d0d;
  --purple: #a78bfa;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;max-width:480px;margin:0 auto;}
button{font-family:var(--font);cursor:pointer;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.logo{font-size:16px;font-weight:600;color:var(--text);}
.logo span{color:var(--accent);}
.logo small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;}
.edit-btn{font-size:12px;padding:5px 12px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--muted);}
.edit-btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);}

/* MONTH NAV */
.month-nav{display:flex;align-items:center;padding:12px 16px 8px;}
.mnav-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:var(--muted);font-size:14px;}
.month-title{font-size:15px;font-weight:500;flex:1;text-align:center;}

/* CALENDAR */
.cal-wrap{padding:0 12px;}
.day-labels{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.dlabel{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cday{border-radius:6px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;cursor:pointer;position:relative;min-height:42px;transition:border-color .15s;}
.cday:active{opacity:.8;}
.cday.empty{background:transparent;border-color:transparent;cursor:default;}
.cday.today{border-color:var(--accent);}
.cday.selected{background:var(--accent-bg);border-color:var(--accent);}
.cday.holiday{background:var(--danger-bg);border-color:var(--danger);}
.cday.holiday .dnum{color:var(--danger);}
.cday.exam{background:var(--warning-bg);border-color:var(--warning);}
.cday.exam .dnum{color:var(--warning);}
.cday.has-data::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--success);position:absolute;bottom:4px;right:4px;}
.dnum{font-size:12px;font-weight:500;}

/* LEGEND */
.legend{display:flex;gap:12px;padding:8px 16px 4px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.leg-dot{width:7px;height:7px;border-radius:50%;}

/* DAY SECTION */
.day-section{padding:10px 12px 24px;}
.hint{font-size:13px;color:var(--muted);text-align:center;padding:24px 0;}

/* DAY CARD */
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:visible;position:relative;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.card-title{font-size:14px;font-weight:500;}
.card-right{display:flex;align-items:center;gap:8px;}
.type-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;}
.badge-class{background:var(--success-bg);color:var(--success);}
.badge-exam{background:var(--warning-bg);color:var(--warning);}
.badge-holiday{background:var(--danger-bg);color:var(--danger);}
.three-dot{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px;border-radius:4px;}

/* DROPDOWN */
.dropdown{position:absolute;right:10px;top:42px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;z-index:50;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.dd-item{padding:11px 14px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);}
.dd-item:last-child{border-bottom:none;}
.dd-item:active{background:var(--border);}
.dd-item.warn{color:var(--warning);}
.dd-item.danger{color:var(--danger);}
.dd-sep{height:1px;background:var(--border);margin:0;}

/* PERIODS */
.periods-row{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--border);scrollbar-width:none;}
.periods-row::-webkit-scrollbar{display:none;}
.per-pill{flex-shrink:0;font-size:11px;padding:4px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--muted);}
.per-pill.practical{background:#1e1333;border-color:#7c3aed44;color:var(--purple);}

/* NOTES */
.notes-area{padding:12px 14px;}
.sub-note{margin-bottom:14px;}
.sub-note:last-child{margin-bottom:0;}
.sub-label{font-size:11px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.sub-label-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sub-label-edit{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--accent);}
.note-text{font-size:13px;color:var(--text);line-height:1.65;white-space:pre-wrap;background:var(--bg);border-radius:var(--radius);padding:9px 11px;border:1px solid var(--border);}
.add-note-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.add-note-chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px dashed var(--border2);background:transparent;color:var(--muted);}
.no-notes{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

/* CHAPTERS */
.ch-area{padding:10px 14px;border-top:1px solid var(--border);}
.ch-area-head{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.ch-list{display:flex;flex-direction:column;gap:6px;}
.ch-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);}
.ch-tag{font-size:10px;padding:2px 7px;border-radius:20px;flex-shrink:0;font-weight:500;}
.ch-name-txt{font-size:13px;flex:1;}
.ch-del{background:none;border:none;color:var(--muted);font-size:14px;padding:0 2px;}

/* EXAM */
.exam-area{padding:12px 14px;}
.exam-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.exam-title{font-size:13px;font-weight:500;color:var(--warning);}
.upload-btn{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--warning);background:transparent;color:var(--warning);}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--warning);aspect-ratio:3/4;cursor:pointer;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-pg{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:white;font-size:10px;padding:3px 6px;text-align:center;}
.photo-del{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:22px;height:22px;color:white;font-size:12px;display:flex;align-items:center;justify-content:center;}
.upload-zone{border:2px dashed var(--warning);border-radius:10px;padding:22px;text-align:center;cursor:pointer;margin-bottom:8px;}
.upload-zone-title{font-size:13px;color:var(--warning);margin-top:6px;}
.upload-zone-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.exam-note-head{font-size:11px;color:var(--warning);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.exam-note-edit{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--warning);background:transparent;color:var(--warning);}
.exam-note-txt{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;}
.exam-note-empty{font-size:12px;color:var(--warning);opacity:.6;}

/* HOLIDAY / SUNDAY */
.day-empty-card{text-align:center;padding:24px 14px;}
.day-empty-icon{font-size:28px;margin-bottom:8px;}
.day-empty-title{font-size:15px;font-weight:500;}
.day-empty-sub{font-size:12px;color:var(--muted);margin-top:5px;}

/* MONTHLY NOTES */
.mnotes-area{padding:12px 14px;}
.mnotes-block{margin-bottom:12px;}
.mnotes-sub{font-size:12px;font-weight:600;margin-bottom:4px;}
.mnotes-txt{font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px 18px 32px;width:100%;max-width:480px;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.modal h3{font-size:15px;font-weight:600;margin-bottom:12px;}
.modal label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);margin-bottom:10px;font-family:var(--font);outline:none;}
.modal textarea{resize:vertical;min-height:90px;}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);}
.mbtns{display:flex;gap:8px;margin-top:4px;}
.mbtns button{flex:1;padding:11px;border-radius:var(--radius);font-size:14px;font-weight:500;}
.bcnl{background:transparent;color:var(--muted);border:1px solid var(--border2);}
.bsave{background:var(--accent);color:white;border:none;}
.bwarn{background:var(--warning);color:#000;border:none;}
.perr{font-size:12px;color:var(--danger);margin-bottom:8px;}
.lockout-msg{font-size:13px;color:var(--danger);text-align:center;padding:8px 0;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;}
.lightbox img{max-width:96%;max-height:72vh;object-fit:contain;border-radius:8px;}
.lb-nav{display:flex;gap:16px;margin-top:14px;}
.lb-btn{background:rgba(255,255,255,.15);border:none;border-radius:var(--radius);padding:8px 18px;color:white;font-size:14px;}
.lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;border-radius:50%;width:34px;height:34px;color:white;font-size:18px;display:flex;align-items:center;justify-content:center;}
.lb-lbl{color:rgba(255,255,255,.5);font-size:12px;margin-top:8px;}

/* STATUS */
.status-bar{font-size:11px;text-align:center;padding:5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);}
.status-bar.syncing{color:var(--warning);}
.status-bar.synced{color:var(--success);}
.status-bar.error{color:var(--danger);}

/* LOADING */
.loading{text-align:center;padding:32px 0;color:var(--muted);font-size:13px;}

@media(max-width:360px){.cday{min-height:36px;}.dnum{font-size:11px;}}
</style>
</head>
<body>

<input type="file" id="fileIn" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
<div id="lightbox"></div>
<div id="modalRoot"></div>

<div class="header">
  <div class="logo">Class<span>Track</span><small>XI-B</small></div>
  <button class="edit-btn" id="editBtn" onclick="openEdit()">🔒 Edit</button>
</div>

<div class="status-bar" id="statusBar">Connecting...</div>

<div class="month-nav">
  <button class="mnav-btn" onclick="changeMonth(-1)">&#8249;</button>
  <div class="month-title" id="monthTitle"></div>
  <button class="mnav-btn" onclick="changeMonth(1)">&#8250;</button>
</div>

<div class="cal-wrap">
  <div class="day-labels">
    <div class="dlabel">S</div><div class="dlabel">M</div><div class="dlabel">T</div>
    <div class="dlabel">W</div><div class="dlabel">T</div><div class="dlabel">F</div><div class="dlabel">S</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:var(--success)"></div>Class data</div>
  <div class="leg"><div class="leg-dot" style="background:var(--warning)"></div>Exam</div>
  <div class="leg"><div class="leg-dot" style="background:var(--danger)"></div>Holiday</div>
</div>

<div class="day-section" id="daySection">
  <div class="hint">Tap a date to view</div>
</div>

<script>
// ═══════════════════════════════════════════
// 🔥 FIREBASE CONFIG
// Replace this block with YOUR Firebase config
// ═══════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAhkiIog4l43aFyyreXD_HaoF3H3_bqrPM",
  authDomain: "classtrack-2026-27.firebaseapp.com",
  databaseURL: "https://classtrack-2026-27-default-rtdb.firebaseio.com",
  projectId: "classtrack-2026-27",
  storageBucket: "classtrack-2026-27.firebasestorage.app",
  messagingSenderId: "367988685226",
  appId: "1:367988685226:web:8264bc6d7335f957e3d3d3",
  measurementId: "G-LGDLMW7JNB"
};

// ═══════════════════════════════════════════
// 🔐 PASSWORD HASH
// This is SHA-256 of "jee2028" — change it by
// running: SHA256("yournewpassword") online and
// pasting the result below
// ═══════════════════════════════════════════
const PASSWORD_HASH = "b8bdd0718d74b46bcdf99e355b5d0f8465a122a22723ce64e95cff88ecfa29b5";

// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const SUBS = ["Physics","Chemistry","Maths","Economics","CS"];
const SUB_COLORS = {Physics:"#4f8ef7",Chemistry:"#22c55e",Maths:"#f97316",Economics:"#a78bfa",CS:"#f59e0b"};
const CHAPTERS = {
  Physics:["Units & Measurement","Motion in Straight Line","Motion in a Plane","Laws of Motion","Work, Energy & Power","Gravitation","Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties","Thermodynamics","Kinetic Theory","Oscillations","Waves"],
  Chemistry:["Basic Concepts","Atomic Structure","Classification of Elements","Chemical Bonding","States of Matter","Thermodynamics","Equilibrium","Redox Reactions","Hydrogen","s-Block Elements","p-Block (Gr 13-14)","Hydrocarbons","Environmental Chemistry"],
  Maths:["Sets","Relations and Functions","Trigonometric Functions","Complex Numbers","Linear Inequalities","Permutations & Combinations","Binomial Theorem","Sequence and Series","Straight Lines","Conic Sections","3D Geometry","Limits and Derivatives","Statistics","Probability"],
  Economics:["Introduction","Consumer Behaviour","Demand","Elasticity of Demand","Production Function","Cost","Revenue","Supply","Market Equilibrium","National Income","Money and Banking","Balance of Payments"],
  CS:["Computer Fundamentals","Number Systems","Boolean Logic","Problem Solving","Python Basics","Data Types","Control Flow","Functions","Lists & Tuples","Dictionaries","File Handling","SQL Basics","Networking"]
};
const TT = {1:["Eng","Chem","Comp/Eco","Phy","Maths/Bio","Chem"],2:["Maths/Bio","Comp/Eco","Phy","Eng","Chem","Phy"],3:["Eng","Phy","Practical","Practical","Chem","Maths/Bio"],4:["Practical","Practical","Chem","Phy","Comp/Eco","Maths/Bio"],5:["Phy","Maths/Bio","Chem","Comp/Eco","Maths/Bio","Eng"],6:["Maths/Bio","Chem","Eng","Phy","Chem","Maths/Bio"]};
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let curM = new Date().getMonth(), curY = new Date().getFullYear();
let selDate = null, editMode = false, ddOpen = false, lbIdx = 0;
let data = {}, db = null, storage = null, dbRef = null;
let editTimeout = null;
// Security: lockout after 3 wrong attempts
let failCount = parseInt(sessionStorage.getItem('ct_fails')||'0');
let lockedUntil = parseInt(sessionStorage.getItem('ct_locked')||'0');
const today = new Date();
const fmt = (y,m,d) => y+'-'+(m+1).toString().padStart(2,'0')+'-'+d.toString().padStart(2,'0');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ═══════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    storage = firebase.storage();
    dbRef = db.ref('classtrack');
    setStatus('Syncing...','syncing');
    dbRef.on('value', snap => {
      data = snap.val() || {};
      setStatus('Live — all changes sync instantly','synced');
      renderCal();
      if(selDate) renderDay();
    }, err => {
      setStatus('Offline — check connection','error');
    });
  } catch(e) {
    setStatus('Firebase not configured — running in demo mode','error');
    // fallback to localStorage for demo
    try { data = JSON.parse(localStorage.getItem('ct_demo')||'{}'); } catch(e) {}
    renderCal();
  }
}

function saveData(path, value) {
  if(dbRef) {
    setStatus('Saving...','syncing');
    db.ref('classtrack/'+path).set(value).then(()=>{
      setStatus('Saved ✓','synced');
    }).catch(()=>setStatus('Save failed','error'));
  } else {
    // demo fallback
    try { localStorage.setItem('ct_demo', JSON.stringify(data)); } catch(e) {}
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar ' + (type||'');
}

// ═══════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════
function renderCal() {
  document.getElementById('monthTitle').textContent = MONTHS[curM] + ' ' + curY;
  const g = document.getElementById('calGrid'); g.innerHTML = '';
  const first = new Date(curY,curM,1).getDay(), total = new Date(curY,curM+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cday empty';g.appendChild(e);}
  for(let d=1;d<=total;d++){
    const dk=fmt(curY,curM,d), dd=data[dk]||{};
    const el=document.createElement('div');
    let cls='cday';
    if(d===today.getDate()&&curM===today.getMonth()&&curY===today.getFullYear()) cls+=' today';
    if(dd.type==='holiday') cls+=' holiday';
    else if(dd.type==='exam') cls+=' exam';
    const hasData=(dd.notes&&Object.values(dd.notes).some(v=>v))||(dd.photos&&dd.photos.length)||(dd.chapters&&dd.chapters.length);
    if(hasData) cls+=' has-data';
    if(selDate===dk) cls+=' selected';
    el.className=cls;
    el.innerHTML='<span class="dnum">'+d+'</span>';
    el.onclick=()=>selectDay(dk);
    g.appendChild(el);
  }
}

function selectDay(dk) { selDate=dk; ddOpen=false; renderCal(); renderDay(); }
function changeMonth(d) { curM+=d; if(curM>11){curM=0;curY++;} if(curM<0){curM=11;curY--;} selDate=null; renderCal(); document.getElementById('daySection').innerHTML='<div class="hint">Tap a date to view</div>'; }

// ═══════════════════════════════════════════
// DAY VIEW
// ═══════════════════════════════════════════
function renderDay() {
  const sec = document.getElementById('daySection');
  if(!selDate){sec.innerHTML='<div class="hint">Tap a date to view</div>';return;}
  const dd=data[selDate]||{}, dow=new Date(selDate+'T00:00:00').getDay();
  const d=new Date(selDate+'T00:00:00'), lbl=DAYS[dow]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
  const isSun=dow===0, dtype=dd.type||'class';

  let badge = dtype==='holiday'?'<span class="type-badge badge-holiday">Holiday</span>':dtype==='exam'?'<span class="type-badge badge-exam">Exam</span>':'<span class="type-badge badge-class">Class</span>';

  let html='<div class="day-card">';
  html+='<div class="card-header"><span class="card-title">'+lbl+'</span><div class="card-right">'+badge;
  if(editMode&&!isSun) html+='<button class="three-dot" onclick="toggleDd(event)">⋮</button>';
  html+='</div></div>';

  // Dropdown
  if(ddOpen&&editMode&&!isSun){
    html+='<div class="dropdown" id="dd" onclick="event.stopPropagation()">';
    html+='<div class="dd-item" onclick="openAddChapter()">📖 Chapter started</div>';
    html+='<div class="dd-item" onclick="openMonthlyNotes()">📅 Monthly notes</div>';
    html+='<div class="dd-sep"></div>';
    if(dtype==='exam') html+='<div class="dd-item warn" onclick="setType(\'class\')">✕ Remove exam</div>';
    else html+='<div class="dd-item warn" onclick="setType(\'exam\')">📝 Mark as exam</div>';
    if(dtype==='holiday') html+='<div class="dd-item danger" onclick="setType(\'class\')">✕ Remove holiday</div>';
    else html+='<div class="dd-item danger" onclick="setType(\'holiday\')">🏖️ Mark as holiday</div>';
    html+='</div>';
  }

  if(isSun){
    html+='<div class="day-empty-card"><div class="day-empty-icon">☀️</div><div class="day-empty-title" style="color:var(--muted)">Sunday</div><div class="day-empty-sub">No school today</div></div>';
    html+='</div>';sec.innerHTML=html;return;
  }
  if(dtype==='holiday'){
    html+='<div class="day-empty-card"><div class="day-empty-icon">🏖️</div><div class="day-empty-title" style="color:var(--danger)">Holiday</div><div class="day-empty-sub">No classes today</div></div>';
    html+='</div>';sec.innerHTML=html;return;
  }
  if(dtype==='exam'){
    html+=buildExam(dd);
    html+='</div>';sec.innerHTML=html;return;
  }

  // Periods
  const periods=TT[dow]||[];
  if(periods.length){
    html+='<div class="periods-row">';
    periods.forEach((p,i)=>{html+='<div class="per-pill'+(p==='Practical'?' practical':'')+'"><span style="opacity:.4;font-size:10px;">'+(i+1)+'.</span> '+p+'</div>';});
    html+='</div>';
  }

  // Notes — all subjects in one flow, only those with content
  const notes=dd.notes||{};
  const hasAnyNote=SUBS.some(s=>notes[s]);
  html+='<div class="notes-area">';
  if(hasAnyNote){
    SUBS.forEach(s=>{
      if(!notes[s])return;
      html+='<div class="sub-note"><div class="sub-label"><div class="sub-label-dot" style="background:'+SUB_COLORS[s]+'"></div>'+s;
      if(editMode) html+='<button class="sub-label-edit" onclick="openNote(\''+s+'\')">edit</button>';
      html+='</div><div class="note-text">'+esc(notes[s])+'</div></div>';
    });
  } else {
    html+='<div class="no-notes">'+(editMode?'No notes yet':'No notes for this day')+'</div>';
  }
  if(editMode){
    const missing=SUBS.filter(s=>!notes[s]);
    if(missing.length){
      html+='<div class="add-note-row">';
      missing.forEach(s=>{html+='<button class="add-note-chip" onclick="openNote(\''+s+'\')">+ '+s+'</button>';});
      html+='</div>';
    }
  }
  html+='</div>';

  // Chapters started
  const chs=dd.chapters||[];
  if(chs.length){
    html+='<div class="ch-area"><div class="ch-area-head">Chapters started today</div><div class="ch-list">';
    chs.forEach((ch,i)=>{
      const c=SUB_COLORS[ch.sub]||'#888';
      html+='<div class="ch-item"><span class="ch-tag" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'33;">'+ch.sub+'</span><span class="ch-name-txt">'+esc(ch.name)+'</span>'+(editMode?'<button class="ch-del" onclick="delChapter('+i+')">✕</button>':'')+'</div>';
    });
    html+='</div></div>';
  }

  html+='</div>';
  sec.innerHTML=html;
}

function buildExam(dd){
  const photos=dd.photos||[];
  let html='<div class="exam-area">';
  html+='<div class="exam-head"><span class="exam-title">📝 Question paper</span>';
  if(editMode) html+='<button class="upload-btn" onclick="triggerUpload()">📷 Upload</button>';
  html+='</div>';
  if(photos.length){
    html+='<div class="photo-grid">';
    photos.forEach((src,i)=>{
      html+='<div class="photo-thumb" onclick="openLb('+i+')"><img src="'+src+'" alt="Page '+(i+1)+'"><div class="photo-pg">Page '+(i+1)+'</div>'+(editMode?'<button class="photo-del" onclick="event.stopPropagation();delPhoto('+i+')">✕</button>':'')+'</div>';
    });
    html+='</div><div style="font-size:11px;color:var(--warning);opacity:.7;margin-bottom:8px;">Tap any page to zoom</div>';
  } else {
    if(editMode) html+='<div class="upload-zone" onclick="triggerUpload()"><div style="font-size:28px">📄</div><div class="upload-zone-title">Upload question paper photos</div><div class="upload-zone-sub">Select multiple pages at once</div></div>';
    else html+='<div style="text-align:center;padding:14px 0;color:var(--muted);font-size:13px;">No question paper uploaded yet</div>';
  }
  const en=dd.examNote||'';
  html+='<div class="exam-note-head"><span>Exam notes / syllabus</span>'+(editMode?'<button class="exam-note-edit" onclick="openExamNote()">✎ edit</button>':'')+'</div>';
  html+=en?'<div class="exam-note-txt">'+esc(en)+'</div>':'<div class="exam-note-empty">'+(editMode?'Tap edit to add syllabus, marks, duration...':'Nothing added')+'</div>';
  html+='</div>';
  return html;
}

// ═══════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════
function toggleDd(e){e.stopPropagation();ddOpen=!ddOpen;renderDay();}
document.addEventListener('click',()=>{if(ddOpen){ddOpen=false;renderDay();}});

function setType(t){
  if(!editMode||!selDate)return;
  ddOpen=false;
  if(!data[selDate])data[selDate]={};
  data[selDate].type=(data[selDate].type===t)?'class':t;
  saveData(selDate+'/type',data[selDate].type);
  renderCal();renderDay();
}

function openNote(sub){
  if(!editMode||!selDate)return;ddOpen=false;
  const ex=((data[selDate]||{}).notes||{})[sub]||'';
  showModal(`<div class="modal-handle"></div>
    <h3><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${SUB_COLORS[sub]};margin-right:7px;vertical-align:-1px;"></span>${sub} notes</h3>
    <label>What was taught today?</label>
    <textarea id="ntxt" placeholder="Topics covered, page numbers, important points, homework...">${esc(ex)}</textarea>
    <div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="saveNote('${sub}')">Save</button></div>`);
}

function saveNote(sub){
  const t=document.getElementById('ntxt').value.trim();
  if(!data[selDate])data[selDate]={};
  if(!data[selDate].notes)data[selDate].notes={};
  if(t)data[selDate].notes[sub]=t;
  else delete data[selDate].notes[sub];
  saveData(selDate+'/notes',data[selDate].notes);
  cModal();renderDay();renderCal();
}

function openAddChapter(){
  if(!editMode||!selDate)return;ddOpen=false;
  const subOpts=SUBS.map(s=>`<option value="${s}">${s}</option>`).join('');
  showModal(`<div class="modal-handle"></div>
    <h3>📖 Chapter started today</h3>
    <label>Subject</label>
    <select id="csub" onchange="updateChOpts()">${'<option value="">— pick subject —</option>'+subOpts}</select>
    <label>Chapter</label>
    <select id="cch"><option value="">— pick subject first —</option></select>
    <div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="saveChapter()">Add</button></div>`);
}

function updateChOpts(){
  const sub=document.getElementById('csub').value;
  const cc=document.getElementById('cch');
  if(!sub){cc.innerHTML='<option value="">— pick subject first —</option>';return;}
  cc.innerHTML=CHAPTERS[sub].map((ch,i)=>`<option value="${i}">${ch}</option>`).join('');
}

function saveChapter(){
  const sub=document.getElementById('csub').value;
  const idx=document.getElementById('cch').value;
  if(!sub||idx==='')return;
  if(!data[selDate])data[selDate]={};
  if(!data[selDate].chapters)data[selDate].chapters=[];
  const name=CHAPTERS[sub][parseInt(idx)];
  if(!data[selDate].chapters.find(c=>c.sub===sub&&c.name===name))
    data[selDate].chapters.push({sub,name});
  saveData(selDate+'/chapters',data[selDate].chapters);
  cModal();renderDay();renderCal();
}

function delChapter(i){
  if(!editMode||!selDate)return;
  data[selDate].chapters.splice(i,1);
  saveData(selDate+'/chapters',data[selDate].chapters);
  renderDay();renderCal();
}

function openMonthlyNotes(){
  ddOpen=false;
  const mkey='m_'+curY+'_'+(curM+1).toString().padStart(2,'0');
  const mdata=(data[mkey])||{};
  if(!editMode){
    const hasAny=SUBS.some(s=>mdata[s]);
    let html=`<div class="modal-handle"></div><h3>📅 ${MONTHS[curM]} ${curY} — Monthly notes</h3><div class="mnotes-area">`;
    if(hasAny){SUBS.forEach(s=>{if(!mdata[s])return;html+=`<div class="mnotes-block"><div class="mnotes-sub" style="color:${SUB_COLORS[s]}">${s}</div><div class="mnotes-txt">${esc(mdata[s])}</div></div>`;});}
    else html+='<div style="color:var(--muted);font-size:13px;padding:8px 0;">No monthly notes for this month yet.</div>';
    html+='</div><div class="mbtns"><button class="bsave" onclick="cModal()">Close</button></div>';
    showModal(html);
  } else {
    const subOpts=SUBS.map(s=>`<option value="${s}">${s}</option>`).join('');
    showModal(`<div class="modal-handle"></div>
      <h3>📅 Monthly notes — ${MONTHS[curM]}</h3>
      <label>Subject</label>
      <select id="msub" onchange="switchMSub()">${subOpts}</select>
      <label id="msubl">Notes for ${SUBS[0]} this month</label>
      <textarea id="mntxt" placeholder="Overall progress, chapters completed, pending topics...">${esc(mdata[SUBS[0]]||'')}</textarea>
      <div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="saveMonthly()">Save</button></div>`);
  }
}

function switchMSub(){
  const sub=document.getElementById('msub').value;
  const mkey='m_'+curY+'_'+(curM+1).toString().padStart(2,'0');
  document.getElementById('msubl').textContent='Notes for '+sub+' this month';
  document.getElementById('mntxt').value=esc((data[mkey]||{})[sub]||'');
}

function saveMonthly(){
  const sub=document.getElementById('msub').value;
  const t=document.getElementById('mntxt').value.trim();
  const mkey='m_'+curY+'_'+(curM+1).toString().padStart(2,'0');
  if(!data[mkey])data[mkey]={};
  if(t)data[mkey][sub]=t;else delete data[mkey][sub];
  saveData(mkey+'/'+sub,t||null);
  cModal();
}

// ═══════════════════════════════════════════
// EXAM PHOTO UPLOAD
// ═══════════════════════════════════════════
function triggerUpload(){if(!editMode||!selDate)return;document.getElementById('fileIn').click();}

function handleFiles(e){
  const files=Array.from(e.target.files);
  if(!files.length||!selDate)return;
  if(!data[selDate])data[selDate]={};
  if(!data[selDate].photos)data[selDate].photos=[];
  setStatus('Uploading photos...','syncing');
  let done=0;
  files.forEach(f=>{
    // If Firebase Storage configured, upload there; else base64
    if(storage&&!FIREBASE_CONFIG.storageBucket.startsWith('REPLACE')){
      const ref=storage.ref(`classtrack/${selDate}/${Date.now()}_${f.name}`);
      ref.put(f).then(snap=>snap.ref.getDownloadURL()).then(url=>{
        data[selDate].photos.push(url);
        saveData(selDate+'/photos',data[selDate].photos);
        done++;if(done===files.length){setStatus('Photos uploaded ✓','synced');renderDay();}
      }).catch(()=>{
        // fallback to base64
        uploadBase64(f,()=>{done++;if(done===files.length){setStatus('Saved locally','synced');renderDay();}});
      });
    } else {
      uploadBase64(f,()=>{done++;if(done===files.length){setStatus('Photos saved','synced');renderDay();}});
    }
  });
  e.target.value='';
}

function uploadBase64(file,cb){
  const r=new FileReader();
  r.onload=ev=>{
    if(!data[selDate].photos)data[selDate].photos=[];
    data[selDate].photos.push(ev.target.result);
    saveData(selDate+'/photos',data[selDate].photos);
    cb();
  };
  r.readAsDataURL(file);
}

function delPhoto(i){
  if(!editMode||!selDate)return;
  data[selDate].photos.splice(i,1);
  saveData(selDate+'/photos',data[selDate].photos);
  renderDay();
}

function openLb(i){
  const photos=(data[selDate]||{}).photos||[];
  lbIdx=i;
  const lb=document.getElementById('lightbox');
  lb.className='lightbox';
  lb.innerHTML=`<button class="lb-close" onclick="closeLb()">✕</button>
    <img id="lbImg" src="${photos[lbIdx]}" alt="Paper">
    <div class="lb-lbl" id="lblbl">Page ${lbIdx+1} of ${photos.length}</div>
    <div class="lb-nav">
      <button class="lb-btn" onclick="moveLb(-1)">‹ Prev</button>
      <button class="lb-btn" onclick="moveLb(1)">Next ›</button>
    </div>`;
}
function moveLb(d){const p=(data[selDate]||{}).photos||[];lbIdx=(lbIdx+d+p.length)%p.length;document.getElementById('lbImg').src=p[lbIdx];document.getElementById('lblbl').textContent='Page '+(lbIdx+1)+' of '+p.length;}
function closeLb(){document.getElementById('lightbox').className='';document.getElementById('lightbox').innerHTML='';}

function openExamNote(){
  if(!editMode||!selDate)return;
  const ex=(data[selDate]||{}).examNote||'';
  showModal(`<div class="modal-handle"></div><h3>Exam notes / syllabus</h3><textarea id="entxt" placeholder="Which chapters were tested, total marks, duration, instructions...">${esc(ex)}</textarea><div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bwarn" onclick="saveExamNote()">Save</button></div>`);
}
function saveExamNote(){
  const t=document.getElementById('entxt').value.trim();
  if(!data[selDate])data[selDate]={};
  data[selDate].examNote=t;
  saveData(selDate+'/examNote',t||null);
  cModal();renderDay();
}

// ═══════════════════════════════════════════
// 🔐 SECURITY — Password with lockout
// ═══════════════════════════════════════════
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function openEdit(){
  if(editMode){
    editMode=false;ddOpen=false;
    clearTimeout(editTimeout);
    document.getElementById('editBtn').className='edit-btn';
    document.getElementById('editBtn').textContent='🔒 Edit';
    renderDay();return;
  }
  const now=Date.now();
  if(lockedUntil>now){
    const secs=Math.ceil((lockedUntil-now)/1000);
    showModal(`<div class="modal-handle"></div><h3>🔒 Locked out</h3><div class="lockout-msg">Too many wrong attempts.<br>Try again in ${secs} seconds.</div><div class="mbtns"><button class="bsave" onclick="cModal()">OK</button></div>`);
    return;
  }
  showModal(`<div class="modal-handle"></div>
    <h3>🔒 Enter password to edit</h3>
    <div id="perr" class="perr"></div>
    <label>Password</label>
    <input type="password" id="pwin" placeholder="Enter your password" autocomplete="current-password">
    <div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="chkPw()">Unlock</button></div>`);
  setTimeout(()=>{const el=document.getElementById('pwin');if(el)el.focus();},100);
}

async function chkPw(){
  const val=document.getElementById('pwin').value;
  const hash=await sha256(val);
  if(hash===PASSWORD_HASH){
    failCount=0;sessionStorage.setItem('ct_fails','0');
    sessionStorage.removeItem('ct_locked');
    editMode=true;
    document.getElementById('editBtn').className='edit-btn on';
    document.getElementById('editBtn').textContent='🔓 Editing';
    cModal();renderDay();
    // Auto-lock after 30 min inactivity
    resetEditTimer();
    document.addEventListener('click',resetEditTimer);
    document.addEventListener('keydown',resetEditTimer);
  } else {
    failCount++;
    sessionStorage.setItem('ct_fails',failCount);
    if(failCount>=3){
      lockedUntil=Date.now()+5*60*1000;
      sessionStorage.setItem('ct_locked',lockedUntil);
      document.getElementById('perr').textContent='❌ 3 wrong attempts — locked for 5 minutes.';
    } else {
      document.getElementById('perr').textContent='❌ Wrong password. '+(3-failCount)+' attempt(s) left.';
    }
  }
}

function resetEditTimer(){
  clearTimeout(editTimeout);
  editTimeout=setTimeout(()=>{
    if(editMode){
      editMode=false;
      document.getElementById('editBtn').className='edit-btn';
      document.getElementById('editBtn').textContent='🔒 Edit';
      renderDay();
      alert('Edit mode auto-locked after 30 minutes of inactivity.');
    }
  },30*60*1000);
}

// ═══════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════
function showModal(inner){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="cModal(event)"><div class="modal" onclick="event.stopPropagation()">${inner}</div></div>`;
}
function cModal(e){if(!e||e.target.classList.contains('modal-bg'))document.getElementById('modalRoot').innerHTML='';}

// ═══════════════════════════════════════════
// KEYBOARD: Enter to confirm modals
// ═══════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')cModal();
  if(e.key==='Enter'&&e.target.id==='pwin'){chkPw();}
});

initFirebase();
